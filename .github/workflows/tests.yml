name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every broken combination, not just the first one to fall over.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.14 is the version this is actually developed and run on, so it is the
        # one that matters most. 3.9 is past end-of-life and kept only because
        # the engine is stdlib-only and there is no reason to break it -- drop it
        # the moment it costs anything.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # One macOS job, on the dev version: that pairing is the machine this
          # tool is written on, so a failure there is a failure I'd hit first.
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step, and there shouldn't ever be one: the engine and the
      # suite are both stdlib-only by rule. If this file ever grows a `pip
      # install`, something has gone wrong upstream of it.
      - name: Run the suite
        run: python3 tests/test_forecast.py

      # The suite replaces urlopen with something that raises, so it cannot
      # reach the network by accident. This makes that guarantee visible at the
      # CI level too: a run that somehow needs the network fails here rather
      # than flaking against a free weather service.
      - name: Confirm the suite declares itself offline
        run: |
          grep -q "test attempted a network call" tests/test_forecast.py
