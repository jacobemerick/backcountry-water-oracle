name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every broken combination, not just the first one to fall over.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.14 is the version this is actually developed and run on, so it is the
        # one that matters most. 3.9 is past end-of-life and kept only because
        # the engine is stdlib-only and there is no reason to break it -- drop it
        # the moment it costs anything.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # One macOS job, on the dev version: that pairing is the machine this
          # tool is written on, so a failure there is a failure I'd hit first.
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step, and there shouldn't ever be one: the engine and the
      # suite are both stdlib-only by rule. If this file ever grows a `pip
      # install`, something has gone wrong upstream of it.
      - name: Run the suite
        run: python3 tests/test_forecast.py

      # The suite replaces urlopen with something that raises, so it cannot
      # reach the network by accident. This makes that guarantee visible at the
      # CI level too: a run that somehow needs the network fails here rather
      # than flaking against a free weather service.
      - name: Confirm the suite declares itself offline
        run: |
          grep -q "test attempted a network call" tests/test_forecast.py

  # "It installs" is its own claim, and the one most likely to break silently:
  # the suite runs from a source checkout and would never notice a broken wheel,
  # a missing entry point, or a package that cannot find its own cache once it
  # lives in site-packages.
  package:
    name: build + install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build the wheel and sdist
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      - name: Install the wheel into a clean venv
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl

      - name: The console script exists and reports its version
        run: /tmp/venv/bin/water-forecast --version

      # Runs against the PINNED three-source fixture, not examples/. This step makes
      # real network calls -- it is the one place the installed wheel is exercised
      # end to end, cache and all -- so its input has to be something whose size is
      # a decision rather than a side effect. examples/ is explicitly free to grow
      # (it went 3 -> 76 sources), and pointing a live-fetch smoke test at it costs
      # one Open-Meteo round trip per source: that took 21 minutes and then failed
      # on a hardcoded count. The fixture is byte-identical to the old examples/
      # file, so this still asserts exactly what it used to.
      - name: It runs from outside the checkout, on its own cache
        working-directory: /tmp
        run: |
          /tmp/venv/bin/water-forecast \
            "$GITHUB_WORKSPACE/tests/fixtures/mazatzal-golden.csv" \
            --asof 2026-07-13 --format json > /tmp/out.json
          python3 -c "
          import json
          d = json.load(open('/tmp/out.json'))
          assert len(d['sources']) == 3, d
          assert d['params']['engine_version'], d['params']
          print('ok:', d['params']['engine_version'], [s['name'][:20] for s in d['sources']])
          "

      # ...and examples/ is still checked, just not over the network: it is the file
      # the README tells people to run first, so "it parses and every row is well
      # formed" is worth a second, while "76 live precip fetches agree with a number
      # written down last release" is not.
      - name: The shipped example still loads
        run: |
          /tmp/venv/bin/python -c "
          import backcountry_water_oracle as bwo
          srcs = bwo.load_sources(['examples/mazatzal-wilderness.csv'])
          assert len(srcs) > 3, len(srcs)
          assert all(s['name'] and s['reports'] is not None for s in srcs)
          print('ok:', len(srcs), 'sources,',
                sum(len(s['reports']) for s in srcs), 'reports')
          "

      - name: The wheel carries the engine and nothing else
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          payload = [n for n in names if not n.split("/")[0].endswith(".dist-info")]
          assert payload == ["backcountry_water_oracle/__init__.py"], payload
          assert not any("fixtures" in n for n in names), "fixtures leaked into the wheel"
          print("wheel payload:", payload)
          EOF
